{% extends "_base_azul.html" %}
{% block title %}Add Reward Tier{% endblock %}

{% block content %}
<div class="azul-section">
  <div class="azul-card" style="max-width: 480px; margin: 0 auto; padding: var(--spacing-xl);">
    <div class="azul-card-header">
      <h3 class="azul-card-title">Add Reward Tier</h3>
    </div>

    <form method="post" class="azul-form">
      <div class="azul-form-group">
        <label>Stamps required</label>
        <input type="number" name="threshold_stamps" min="1" value="5" required>
        <p style="font-size: var(--font-size-sm); color: var(--azul-muted); margin-top: var(--spacing-xs);">
          Total stamps needed to qualify for this reward (e.g., 5 for first reward)
        </p>
      </div>

      <div class="azul-form-group">
        <label>Reward name</label>
        <input type="text" name="name" required placeholder="e.g. Free Coffee">
      </div>

      <div class="azul-form-group">
        <label>Description</label>
        <textarea name="description" rows="3" placeholder="e.g. Any item of equal or lesser value"></textarea>
      </div>

      <div class="azul-form-group">
        <label>
          <input type="checkbox" name="is_available" checked>
          Available to customers
        </label>
      </div>

      <button type="submit" class="azul-btn azul-btn--primary azul-btn--large">Add Reward</button>
    </form>

    <div style="margin-top: var(--spacing-xl); text-align: center;">
      <a href="{{ url_for('settings') }}" class="azul-btn azul-btn--ghost">Cancel</a>
    </div>
  </div>
</div>

<style>
  {% block extra_page_css %}
  .azul-section {
    max-width: 960px;
    margin: 0 auto;
    padding: 0;
  }

  .azul-form-group {
    margin-bottom: var(--spacing-lg);
  }

  .azul-form-group label {
    display: block;
    margin-bottom: var(--spacing-xs);
    font-size: var(--font-size-sm);
    color: var(--azul-muted);
    font-weight: 500;
  }

  .azul-form-group input,
  .azul-form-group textarea {
    width: 100%;
    padding: var(--spacing-md);
    border: 1px solid var(--azul-border);
    border-radius: var(--radius-md);
    font-size: var(--font-size-base);
  }

  .azul-form-group input:focus,
  .azul-form-group textarea:focus {
    outline: none;
    border-color: var(--azul-accent);
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
  }

  .azul-form-group input[type="checkbox"] {
    width: auto;
    margin-right: var(--spacing-sm);
  }

  .azul-btn--large {
    width: 100%;
    padding: var(--spacing-lg);
    font-size: var(--font-size-lg);
  }
  {% endblock %}
</style>
{% endblock %}
