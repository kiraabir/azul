<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" role="img" aria-label="AZUL loyalty card logo">
  <defs>
    <linearGradient id="azulGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0c4a6e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Icon mark -->
  <g filter="url(#softShadow)">
    <path d="M12 44 L24 8 L36 44 Z" fill="url(#azulGrad)"/>
    <path d="M24 18 L28 36 L20 36 Z" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- Wordmark -->
  <text x="48" y="46"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800"
        font-size="40"
        letter-spacing="2"
        fill="#0ea5e9"
        style="font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;">
    AZUL
  </text>
</svg>